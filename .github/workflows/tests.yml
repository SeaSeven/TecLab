name: TecLab tests
on:
  push:
    branches: [main, feature/lab-008-v1-0]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprovar catàleg i tests
        run: |
          npm run build
          git diff --exit-code -- data/laboratories.json
          npm test
