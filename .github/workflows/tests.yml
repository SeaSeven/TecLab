name: TecLab tests
on:
  push:
    branches: [main, feature/lab-008-v1-0]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprovar catàleg i tests
        run: |
          npm run build
          git diff --exit-code -- data/laboratories.json
          npm test
      - name: Previsualització real amb Chromium
        run: |
          python3 -m http.server 8765 > /tmp/teclab-server.log 2>&1 &
          sleep 2
          BROWSER=$(command -v google-chrome || command -v chromium || true)
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=3000 --dump-dom http://127.0.0.1:8765/labs/lab-008/ > /tmp/lab008-dom.html
          grep 'id="scopeSvg"' /tmp/lab008-dom.html
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=3000 --window-size=1440,1000 --screenshot=/tmp/lab008-screenshot.png http://127.0.0.1:8765/labs/lab-008/
      - name: Captura de pantalla per revisar
        uses: actions/upload-artifact@v4
        with:
          name: lab-008-captura
          path: /tmp/lab008-screenshot.png
      - name: Previsualitzar LAB-002 i LAB-003 en Chromium
        run: |
          python3 -m http.server 8766 > /tmp/teclab-reactius.log 2>&1 &
          sleep 2
          BROWSER=$(command -v google-chrome || command -v chromium)
          for LAB in 002 003; do
            "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=4000 --dump-dom "http://127.0.0.1:8766/labs/lab-$LAB/" > "/tmp/lab-$LAB-dom.html"
            grep 'class="reactive-workspace"' "/tmp/lab-$LAB-dom.html"
            grep 'id="reactive-level"' "/tmp/lab-$LAB-dom.html"
            "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=4000 --window-size=1440,1000 --screenshot="/tmp/lab-$LAB-captura.png" "http://127.0.0.1:8766/labs/lab-$LAB/"
          done
      - name: Captures dels laboratoris reactius
        uses: actions/upload-artifact@v4
        with:
          name: lab-002-003-captures
          path: |
            /tmp/lab-002-captura.png
            /tmp/lab-003-captura.png
      - name: Previsualitzar LAB-009 i LAB-010 en Chromium
        run: |
          python3 -m http.server 8767 > /tmp/teclab-components.log 2>&1 &
          sleep 2
          BROWSER=$(command -v google-chrome || command -v chromium)
          for LAB in 009 010; do
            "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=4000 --dump-dom "http://127.0.0.1:8767/labs/lab-$LAB/" > "/tmp/lab-$LAB-dom.html"
            grep 'class="component-workspace"' "/tmp/lab-$LAB-dom.html"
            grep 'id="component-level"' "/tmp/lab-$LAB-dom.html"
            "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=4000 --window-size=1440,1000 --screenshot="/tmp/lab-$LAB-captura.png" "http://127.0.0.1:8767/labs/lab-$LAB/"
          done
      - name: Captures dels nous laboratoris de components
        uses: actions/upload-artifact@v4
        with:
          name: lab-009-010-captures
          path: |
            /tmp/lab-009-captura.png
            /tmp/lab-010-captura.png
