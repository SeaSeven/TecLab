name: LAB-011 validation

on:
  push:
    branches:
      - feature/lab-011-qualitat-xarxa
  pull_request:
    paths:
      - 'labs/lab-011/**'
      - 'scripts/lab-011.test.js'
      - 'scripts/catalog-areas.test.js'
      - 'shared/components/catalog.js'
      - 'shared/components/app.js'
      - 'shared/css/catalog.css'
      - 'data/laboratories.json'
      - 'shared/services/exercises.js'
      - '.github/workflows/lab-011-validation.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: npm test
      - name: Verify catalog build
        run: npm run build
      - name: Verify LAB-011 JavaScript syntax
        run: |
          for file in labs/lab-011/*.js; do node --check "$file"; done
